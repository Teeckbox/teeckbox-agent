name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build
      # The released form must work too: one self-contained file, and the container image.
      - name: Publish one file and run it
        run: |
          dotnet publish src/Teeckbox.Agent --configuration Release --runtime linux-x64 --self-contained             -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:InformationalVersion=0.0.0-ci --output out
          [ "$(out/teeckbox-agent version)" = "0.0.0-ci" ]
      - name: Build the container image
        run: docker build --build-arg VERSION=0.0.0-ci --tag teeckbox-agent:ci . && [ "$(docker run --rm teeckbox-agent:ci version)" = "0.0.0-ci" ]
