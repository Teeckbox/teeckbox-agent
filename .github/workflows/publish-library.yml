name: Publish the library

# Publishes the NuGet package Teeckbox.Outbound when a tag lib-vMAJOR.MINOR.PATCH is pushed (for example lib-v0.32.0).
# Nothing is published by any other event. The package is built, tested, attested and only then pushed to the GitHub
# Packages feed of the organization (https://nuget.pkg.github.com/Teeckbox/index.json), with the token of the run:
# no secret has to be stored.

on:
  push:
    tags: ['lib-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GitHub Packages
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#lib-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The tag '$GITHUB_REF_NAME' is not lib-vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: dotnet build --configuration Release -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Teeckbox.Outbound --configuration Release --no-build -p:Version=${{ steps.version.outputs.version }} --output packages

      - name: Fingerprints
        run: sha256sum packages/* | tee packages/SHA256SUMS.txt

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'packages/*.nupkg'

      - name: Push to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$GITHUB_TOKEN" --source https://nuget.pkg.github.com/Teeckbox/index.json --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages
