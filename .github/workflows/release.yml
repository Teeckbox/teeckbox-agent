name: Release the agent

# Runs when a tag vMAJOR.MINOR.PATCH is pushed (for example v0.32.0): the agent is versioned with Teeckbox.
# It builds the agent for Linux x64, Linux arm64 and Windows x64, tests it, and prepares a DRAFT release: the files, their SHA-256, a build
# provenance attestation, an SBOM and a signature of each file. It also pushes the container image. Nothing is visible to users until
# the draft release is published by a maintainer.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "The tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: dotnet build --configuration Release -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test --configuration Release --no-build

  build:
    needs: test
    strategy:
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - rid: linux-arm64
            os: ubuntu-latest
            archive: tar.gz
          - rid: win-x64
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish one self-contained file
        shell: bash
        run: |
          dotnet publish src/Teeckbox.Agent --configuration Release --runtime ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None \
            -p:InformationalVersion=${{ needs.test.outputs.version }} -p:ContinuousIntegrationBuild=true --output out

      - name: Run it once
        if: matrix.rid != 'linux-arm64'
        shell: bash
        run: |
          binary="out/teeckbox-agent"; [ -f "$binary.exe" ] && binary="$binary.exe"
          [ "$("$binary" version)" = "${{ needs.test.outputs.version }}" ]

      - name: Windows installer (wizard)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.test.outputs.version }}" "/DSourceDir=$PWD\out" deploy\windows\installer.iss

      - name: Archive
        shell: bash
        run: |
          name="teeckbox-agent-${{ needs.test.outputs.version }}-${{ matrix.rid }}"
          mkdir -p "dist/$name"
          cp out/teeckbox-agent* "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          if [[ "${{ matrix.rid }}" == linux-* ]]; then
            cp deploy/linux/teeckbox-agent.service "dist/$name/"
            chmod +x "dist/$name/teeckbox-agent"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          else
            cp deploy/windows/install-service.ps1 "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          fi
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.rid }}
          path: dist/*

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the draft release
      id-token: write       # keyless signature and attestation
      attestations: write
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true

      - name: One-command installer for Linux (stamped with this version)
        run: sed "s/@VERSION@/$VERSION/" deploy/linux/install.sh > dist/teeckbox-agent-install.sh

      - name: SBOM
        run: |
          dotnet tool install --global CycloneDX --version 5.5.0
          dotnet-CycloneDX src/Teeckbox.Agent/Teeckbox.Agent.csproj --output dist --filename "teeckbox-agent-$VERSION.sbom.json" --json

      - name: SHA-256 of every file
        working-directory: dist
        run: sha256sum teeckbox-agent-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.sh

      - uses: sigstore/cosign-installer@v3

      - name: Sign every file (keyless)
        working-directory: dist
        run: |
          for file in teeckbox-agent-* SHA256SUMS.txt; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "Teeckbox agent $VERSION" \
            --notes "Verify a download before you install it: see 'Verifying a release' in the README. Version $VERSION is meant for Teeckbox $VERSION and the releases of the same major version."

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/teeckbox/teeckbox-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(needs.test.outputs.version, '-') }}
      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.test.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/teeckbox/teeckbox-agent
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        run: cosign sign --yes "ghcr.io/teeckbox/teeckbox-agent@${{ steps.push.outputs.digest }}"
